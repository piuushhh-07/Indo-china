services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: indochina_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: local_dev_only
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - indochina_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d indochina_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  indochina_postgres_data:
