<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log In | Indo China – Family Restaurant</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🥢</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/main.css">
</head>
<body data-page="account">
<div id="site-header"></div>
<main class="section">
  <div class="container" style="max-width:420px;">
    <h1 style="font-size:2rem;">Log In</h1>
    <form id="loginForm" class="panel" style="padding:var(--space-5);">
      <div class="field"><label for="mobile">Mobile number</label><input id="mobile" type="tel" required></div>
      <div class="field"><label for="password">Password</label><input id="password" type="password" required></div>
      <button type="submit" class="btn btn-primary btn-block">Log In</button>
      <p id="loginError" class="field-error" style="display:none;"></p>
      <p class="field-hint">New here? <a href="/register.html" style="color:var(--gold-300);">Create an account</a>, or continue as a <a href="/menu.html" style="color:var(--gold-300);">guest</a>.</p>
    </form>
  </div>
</main>
<div id="site-footer"></div>
<script src="/js/api.js"></script><script src="/js/cart.js"></script><script src="/js/chrome.js"></script>
<script>
document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const errorEl = document.getElementById('loginError');
  errorEl.style.display = 'none';
  try {
    await api.post('/auth/login', { mobile: document.getElementById('mobile').value.trim(), password: document.getElementById('password').value });
    location.href = '/account.html';
  } catch (err) { errorEl.textContent = err.message; errorEl.style.display = 'block'; }
});
</script>
</body>
</html>
