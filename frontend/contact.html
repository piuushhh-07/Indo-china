<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact &amp; Location | Indo China – Family Restaurant</title>
<meta name="description" content="Contact Indo China – Family Restaurant in Ambernath — address, phone, hours and directions.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🥢</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/main.css">
</head>
<body data-page="contact">
<div id="site-header"></div>

<main class="section">
  <div class="container two-col" style="align-items:start;">
    <div>
      <p class="eyebrow">Get in touch</p>
      <h1 style="font-size:2.2rem;">Contact &amp; Location</h1>
      <div class="panel" style="padding:var(--space-5);">
        <h4 style="margin-top:0;">Visit us</h4>
        <p style="font-size:0.95rem;">Shop No. 14, Shivaji Road, Kansai Section, Ambernath, Maharashtra 421501</p>
        <p id="phoneBlock" class="text-muted" style="font-size:0.95rem;">Phone number coming soon</p>
        <p id="hoursBlockFull" class="text-muted" style="font-size:0.9rem;"></p>
        <a id="mapsLinkContact" href="#" target="_blank" rel="noopener" class="btn btn-outline btn-sm">Get Directions</a>
        <a href="/reservations.html" class="btn btn-ghost btn-sm">Book a Table</a>
      </div>
    </div>

    <div>
      <form id="contactForm" class="panel" style="padding:var(--space-5);">
        <h3 style="margin-top:0;">Send us a message</h3>
        <!-- Honeypot field — hidden from real users via CSS, bots tend to fill every field -->
        <div class="field" style="position:absolute;left:-9999px;">
          <label for="website">Leave this field empty</label>
          <input id="website" name="website" tabindex="-1" autocomplete="off">
        </div>
        <div class="field"><label for="ctName">Name</label><input id="ctName" required></div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:var(--space-4);">
          <div class="field"><label for="ctEmail">Email</label><input id="ctEmail" type="email"></div>
          <div class="field"><label for="ctPhone">Phone</label><input id="ctPhone" type="tel"></div>
        </div>
        <div class="field"><label for="ctMessage">Message</label><textarea id="ctMessage" rows="4" required></textarea></div>
        <button type="submit" class="btn btn-primary btn-block">Send Message</button>
        <p id="ctSuccess" class="field-hint" style="display:none;color:var(--success-500);">Thanks — we'll get back to you soon.</p>
        <p id="ctError" class="field-error" style="display:none;"></p>
      </form>
    </div>
  </div>
</main>

<div id="site-footer"></div>
<script src="/js/api.js"></script>
<script src="/js/cart.js"></script>
<script src="/js/chrome.js"></script>
<script>
document.addEventListener('DOMContentLoaded', async () => {
  try {
    const { settings } = await api.get('/settings');
    if (settings.phone) document.getElementById('phoneBlock').innerHTML = `<a href="tel:${settings.phone}">${settings.phone}</a>`;
    if (settings.google_maps_url) document.getElementById('mapsLinkContact').href = settings.google_maps_url;
    if (settings.opening_hours) {
      const order = ['mon','tue','wed','thu','fri','sat','sun'];
      const label = { mon: 'Mon', tue: 'Tue', wed: 'Wed', thu: 'Thu', fri: 'Fri', sat: 'Sat', sun: 'Sun' };
      document.getElementById('hoursBlockFull').innerHTML = order
        .filter((d) => settings.opening_hours[d])
        .map((d) => `${label[d]}: ${settings.opening_hours[d].open}–${settings.opening_hours[d].close}`)
        .join('<br>');
    }
  } catch { /* contact info stays at static defaults */ }

  document.getElementById('contactForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const errorEl = document.getElementById('ctError');
    const successEl = document.getElementById('ctSuccess');
    errorEl.style.display = 'none'; successEl.style.display = 'none';
    try {
      await api.post('/contact', {
        name: document.getElementById('ctName').value.trim(),
        email: document.getElementById('ctEmail').value.trim() || undefined,
        phone: document.getElementById('ctPhone').value.trim() || undefined,
        message: document.getElementById('ctMessage').value.trim(),
        website: document.getElementById('website').value // honeypot
      });
      successEl.style.display = 'block';
      document.getElementById('contactForm').reset();
    } catch (err) {
      errorEl.textContent = err.message;
      errorEl.style.display = 'block';
    }
  });
});
</script>
</body>
</html>
